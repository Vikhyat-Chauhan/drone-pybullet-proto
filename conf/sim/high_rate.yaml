# @package _global_
# description: Finer control loop: nav decisions at 200Hz.
defaults:
  - default
  - _self_

# Finer control loop -- nav decisions computed twice as often. Extends
# sim/default.yaml (see conf/run/smoke.yaml's comment for why the `defaults`
# list here matters) so every sim-group field stays present/overridable.
rate_hz: 200
